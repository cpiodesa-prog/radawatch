name: Declarations (every 6 hours)

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"   # every 6 hours UTC
  workflow_dispatch:

jobs:
  declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run declaration collectors
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_DECLARATIONS: ${{ secrets.TELEGRAM_CHAT_DECLARATIONS }}
        run: python -m scripts.run_pipeline --filter declarations

      - name: Commit state
        run: |
          git config user.name "RadaWatch Bot"
          git config user.email "bot@cpi.org.ua"
          git add state/ || true
          git diff --cached --quiet || git commit -m "state: declarations $(date -u +%Y-%m-%dT%H:%M)"
          git diff --cached --quiet 2>/dev/null || git push
