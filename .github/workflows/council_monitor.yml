name: Council Monitor (2x/day)

on:
  schedule:
    - cron: "0 8,14 * * *"   # 10:00 + 16:00 Kyiv (UTC+2 winter) / 11:00 + 17:00 (UTC+3 summer)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run council collectors
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ODESA: ${{ secrets.TELEGRAM_CHAT_ODESA }}
          TELEGRAM_CHAT_MYKOLAIV: ${{ secrets.TELEGRAM_CHAT_MYKOLAIV }}
          TELEGRAM_CHAT_KHERSON: ${{ secrets.TELEGRAM_CHAT_KHERSON }}
        run: python -m scripts.run_pipeline --filter council

      - name: Commit state
        run: |
          git config user.name "RadaWatch Bot"
          git config user.email "bot@cpi.org.ua"
          git add state/ || true
          git diff --cached --quiet || git commit -m "state: council monitor $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
